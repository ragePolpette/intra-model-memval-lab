[project]
name = "intra-model-memval-lab"
version = "0.1.0"
description = "Auditable episode/trace/evaluation infrastructure plus a LoRA consolidation pipeline (lesson -> synthetic dataset -> LoRA training -> promote/rollback) for Gemma 3 270M IT"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
train = [
    "torch>=2.1",
    "transformers>=4.50",
    "peft>=0.10",
    "accelerate>=0.30",
]
spike = [
    "torch>=2.1",
    "transformers>=4.50",
    "sae-lens>=6.49,<7",
]

[project.scripts]
intra-model-exp = "intra_model_memval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intra_model_memval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
